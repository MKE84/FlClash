name: android

# Builds installable Android APKs from any branch, without the release plumbing in
# build.yaml (no Telegram, no Homebrew, no public-repository gate, no signing secrets
# required). Every run gets an artifact; a signed keystore is optional.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ABIs: arm64, arm, amd64 (comma separated)'
        required: false
        default: 'arm64'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TARGET_PLATFORMS: ${{ inputs.arch || 'arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=$KEY_ALIAS"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
            echo 'Signing with the repository keystore.'
          else
            echo '::warning::No KEYSTORE secret; the APK will be debug-signed (installable, not upgradeable over a release build).'
          fi

      # The native build hooks fetch the Go core and the Rust/C++ bits themselves,
      # so there is no extra fetch step here.
      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      # setup.dart packages through flutter_distributor and refuses to run when a
      # package's build_assets hook was turned off, so podspec/pubspec stay untouched.
      - name: Build APK
        run: |
          set -euo pipefail
          for arch in ${TARGET_PLATFORMS//,/ }; do
            dart setup.dart android --arch "$arch" --env pre -v
          done

      - name: Collect artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} out/ \;
          ls -lh out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-android-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          overwrite: true
